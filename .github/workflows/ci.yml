name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore src/WowStopwatcher.slnx
      - run: dotnet build src/WowStopwatcher.slnx -c Release --no-restore
      - run: dotnet test src/WowStopwatcher.slnx -c Release --no-build
      - name: Build and test with everything off except Today
        shell: bash
        run: |
          FLAGS="-p:FeatureStatistics=false -p:FeatureSettings=false -p:FeatureInvoicing=false -p:FeatureIndependent=false -p:FeatureGoals=false -p:FeaturePermanent=false -p:FeatureTray=false -p:FeatureHotkeys=false -p:FeatureGoalNotifications=false -p:FeatureAutostart=false -p:FeatureUpdateCheck=false"
          dotnet build src/WowStopwatcher.slnx -c Release $FLAGS
          dotnet test src/WowStopwatcher.slnx -c Release --no-build $FLAGS
      - name: Build and test with everything off except Settings
        shell: bash
        run: |
          FLAGS="-p:FeatureToday=false -p:FeatureStatistics=false -p:FeatureInvoicing=false -p:FeatureIndependent=false -p:FeatureGoals=false -p:FeaturePermanent=false -p:FeatureTray=false -p:FeatureHotkeys=false -p:FeatureGoalNotifications=false -p:FeatureAutostart=false -p:FeatureUpdateCheck=false"
          dotnet build src/WowStopwatcher.slnx -c Release $FLAGS
          dotnet test src/WowStopwatcher.slnx -c Release --no-build $FLAGS
