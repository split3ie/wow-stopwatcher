name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore src/WowStopwatcher.slnx
      - run: dotnet build src/WowStopwatcher.slnx -c Release --no-restore
      - run: dotnet test src/WowStopwatcher.slnx -c Release --no-build
